
services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: oc_web
    environment:
      PHP_MEMORY_LIMIT: "512M"
      PHP_UPLOAD_MAX_FILESIZE: "64M"
      PHP_POST_MAX_SIZE: "64M"
    volumes:
      - ./upload:/var/www/html
      - ./docker/php/nginx.conf:/etc/nginx/nginx.conf:ro     # <-- добавили main
      - ./docker/php/opencart.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-oc.ini:ro
      - ./docker/php/supervisord.conf:/etc/supervisord.conf:ro
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]  # served by nginx location below
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - oc_net

  db:
    image: mysql:8.0
    container_name: oc_db
    command: --default-authentication-plugin=caching_sha2_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "33060:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - oc_net

  adminer:
    image: adminer:latest
    container_name: oc_adminer
    #ports:
    #  - "8081:8080"
    depends_on:
      - db
    networks:
      - oc_net

volumes:
  db_data:
networks:
  oc_net:
    driver: bridge